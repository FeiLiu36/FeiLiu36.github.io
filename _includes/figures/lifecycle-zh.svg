<svg class="bf " viewBox="0 0 760 496" role="img" aria-labelledby="f2t-zh f2d-zh" xmlns="http://www.w3.org/2000/svg">
<title id="f2t-zh">设计流程各环节由谁完成</title><desc id="f2d-zh">13 个代表性系统在构思、设计、评估三个环节中由人、人与 AI 共同或 AI 完成。设计大多由 AI 完成，构思几乎全由人完成，评估在多数系统中仍由人完成。</desc>
<text x="476" y="32" class="bf-colhead" style="text-anchor:middle">构思</text>
<text x="580" y="32" class="bf-colhead" style="text-anchor:middle">设计</text>
<text x="684" y="32" class="bf-colhead" style="text-anchor:middle">评估</text>
<line x1="10" y1="44" x2="750" y2="44" class="bf-rule"/>
<g class="bf-row"><title>算法配置: 人提供带参数的求解器、实例和代价指标；AI 选择参数值。</title>
<rect x="10" y="43" width="740" height="30" class="bf-hit"/>
<text x="14" y="61" class="bf-small bf-muted bf-num" style="text-anchor:start">2009–16</text>
<text x="86" y="61" class="bf-label" style="text-anchor:start">算法配置</text>
<circle cx="476" cy="56" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="56" r="8" class="bf-ball-empty"/>
<circle cx="684" cy="56" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>学习分支策略: 神经网络在人搭建的分支定界求解器内学习分支规则。</title>
<rect x="10" y="73" width="740" height="30" class="bf-hit"/>
<text x="14" y="91" class="bf-small bf-muted bf-num" style="text-anchor:start">2019</text>
<text x="86" y="91" class="bf-label" style="text-anchor:start">学习分支策略</text>
<circle cx="476" cy="86" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="86" r="8" class="bf-ball-empty"/><path d="M580,78 A8,8 0 0 0 580,94 Z" class="bf-ball-half"/>
<circle cx="684" cy="86" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>神经求解器: 人设计网络与训练方式；模型学习路径问题的构造策略。</title>
<rect x="10" y="103" width="740" height="30" class="bf-hit"/>
<text x="14" y="121" class="bf-small bf-muted bf-num" style="text-anchor:start">2019</text>
<text x="86" y="121" class="bf-label" style="text-anchor:start">神经求解器</text>
<circle cx="476" cy="116" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="116" r="8" class="bf-ball-empty"/><path d="M580,108 A8,8 0 0 0 580,124 Z" class="bf-ball-half"/>
<circle cx="684" cy="116" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>EoH: 人选定问题，给出函数签名、任务描述和评估实例；LLM 显式地提出并演化算法思路（“thought”），与代码一同演化。</title>
<rect x="10" y="133" width="740" height="30" class="bf-hit"/>
<text x="14" y="151" class="bf-small bf-muted bf-num" style="text-anchor:start">2024</text>
<text x="86" y="151" class="bf-label" style="text-anchor:start">EoH</text>
<circle cx="476" cy="146" r="8" class="bf-ball-empty"/><path d="M476,138 A8,8 0 0 0 476,154 Z" class="bf-ball-half"/>
<circle cx="580" cy="146" r="8" class="bf-ball-full"/>
<circle cx="684" cy="146" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>OptiMUS: 人用自然语言描述问题；智能体建模、写代码、调试并检查。</title>
<rect x="10" y="163" width="740" height="30" class="bf-hit"/>
<text x="14" y="181" class="bf-small bf-muted bf-num" style="text-anchor:start">2024</text>
<text x="86" y="181" class="bf-label" style="text-anchor:start">OptiMUS</text>
<circle cx="476" cy="176" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="176" r="8" class="bf-ball-full"/>
<circle cx="684" cy="176" r="8" class="bf-ball-empty"/><path d="M684,168 A8,8 0 0 0 684,184 Z" class="bf-ball-half"/>
</g>
<g class="bf-row"><title>AI Scientist: 人提供代码模板和 1–2 个种子想法；由 LLM 审稿人评估。</title>
<rect x="10" y="193" width="740" height="30" class="bf-hit"/>
<text x="14" y="211" class="bf-small bf-muted bf-num" style="text-anchor:start">2024</text>
<text x="86" y="211" class="bf-label" style="text-anchor:start">AI Scientist</text>
<circle cx="476" cy="206" r="8" class="bf-ball-empty"/><path d="M476,198 A8,8 0 0 0 476,214 Z" class="bf-ball-half"/>
<circle cx="580" cy="206" r="8" class="bf-ball-full"/>
<circle cx="684" cy="206" r="8" class="bf-ball-empty"/><path d="M684,198 A8,8 0 0 0 684,214 Z" class="bf-ball-half"/>
</g>
<g class="bf-row"><title>AI Scientist-v2: 人给出大致主题并挑选想法与最终论文；AI 生成想法、代码和论文；由 LLM 审稿人评估。</title>
<rect x="10" y="223" width="740" height="30" class="bf-hit"/>
<text x="14" y="241" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="241" class="bf-label" style="text-anchor:start">AI Scientist-v2</text>
<circle cx="476" cy="236" r="8" class="bf-ball-empty"/><path d="M476,228 A8,8 0 0 0 476,244 Z" class="bf-ball-half"/>
<circle cx="580" cy="236" r="8" class="bf-ball-full"/>
<circle cx="684" cy="236" r="8" class="bf-ball-empty"/><path d="M684,228 A8,8 0 0 0 684,244 Z" class="bf-ball-half"/>
</g>
<g class="bf-row"><title>AlphaEvolve: 用户提供 evaluate 函数和一个完整（可以很粗糙）的初始程序。</title>
<rect x="10" y="253" width="740" height="30" class="bf-hit"/>
<text x="14" y="271" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="271" class="bf-label" style="text-anchor:start">AlphaEvolve</text>
<circle cx="476" cy="266" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="266" r="8" class="bf-ball-full"/>
<circle cx="684" cy="266" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>Darwin Gödel Machine: 智能体改写自身代码；目标（代码基准）与算力预算由人设定。</title>
<rect x="10" y="283" width="740" height="30" class="bf-hit"/>
<text x="14" y="301" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="301" class="bf-label" style="text-anchor:start">Darwin Gödel Machine</text>
<circle cx="476" cy="296" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="296" r="8" class="bf-ball-full"/>
<circle cx="684" cy="296" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>ShinkaEvolve: 人提供带演化标记的初始程序，以及返回分数的评估脚本。</title>
<rect x="10" y="313" width="740" height="30" class="bf-hit"/>
<text x="14" y="331" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="331" class="bf-label" style="text-anchor:start">ShinkaEvolve</text>
<circle cx="476" cy="326" r="8" class="bf-ball-empty"/>
<circle cx="580" cy="326" r="8" class="bf-ball-full"/>
<circle cx="684" cy="326" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>DeepScientist: 智能体在人选定的前沿任务上提出并验证数千个想法，以人的基准衡量。</title>
<rect x="10" y="343" width="740" height="30" class="bf-hit"/>
<text x="14" y="361" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="361" class="bf-label" style="text-anchor:start">DeepScientist</text>
<circle cx="476" cy="356" r="8" class="bf-ball-empty"/><path d="M476,348 A8,8 0 0 0 476,364 Z" class="bf-ball-half"/>
<circle cx="580" cy="356" r="8" class="bf-ball-full"/>
<circle cx="684" cy="356" r="8" class="bf-ball-empty"/>
</g>
<g class="bf-row"><title>AlphaResearch: AI 提出想法并由学习到的审稿模型筛选；问题由人定义。</title>
<rect x="10" y="373" width="740" height="30" class="bf-hit"/>
<text x="14" y="391" class="bf-small bf-muted bf-num" style="text-anchor:start">2025</text>
<text x="86" y="391" class="bf-label" style="text-anchor:start">AlphaResearch</text>
<circle cx="476" cy="386" r="8" class="bf-ball-empty"/><path d="M476,378 A8,8 0 0 0 476,394 Z" class="bf-ball-half"/>
<circle cx="580" cy="386" r="8" class="bf-ball-full"/>
<circle cx="684" cy="386" r="8" class="bf-ball-empty"/><path d="M684,378 A8,8 0 0 0 684,394 Z" class="bf-ball-half"/>
</g>
<g class="bf-row"><title>Evolution of Benchmark: LLM 演化基准测试程序本身；目标由人设定。</title>
<rect x="10" y="403" width="740" height="30" class="bf-hit"/>
<text x="14" y="421" class="bf-small bf-muted bf-num" style="text-anchor:start">2026</text>
<text x="86" y="421" class="bf-label" style="text-anchor:start">Evolution of Benchmark</text>
<circle cx="476" cy="416" r="8" class="bf-ball-empty"/>
<line x1="575" y1="416" x2="585" y2="416" class="bf-faint-line"/>
<circle cx="684" cy="416" r="8" class="bf-ball-empty"/><path d="M684,408 A8,8 0 0 0 684,424 Z" class="bf-ball-half"/>
</g>
<line x1="10" y1="446" x2="750" y2="446" class="bf-rule"/>
<circle cx="21" cy="468" r="7" class="bf-ball-full"/>
<text x="35" y="472" class="bf-small bf-muted" style="text-anchor:start">AI</text>
<circle cx="94" cy="468" r="7" class="bf-ball-empty"/><path d="M94,461 A7,7 0 0 0 94,475 Z" class="bf-ball-half"/>
<text x="108" y="472" class="bf-small bf-muted" style="text-anchor:start">人与 AI 共同</text>
<circle cx="245" cy="468" r="7" class="bf-ball-empty"/>
<text x="259" y="472" class="bf-small bf-muted" style="text-anchor:start">人</text>
<text x="746" y="472" class="bf-note" style="text-anchor:end">依据各论文要求人提供的内容</text>
</svg>
