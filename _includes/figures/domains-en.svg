<title id="f3t-en">Stage reached in each domain, and production use</title><desc id="f3d-en">Highest stage (as in Figure 1) reached by AI in eight domains, and where AI-designed algorithms have been deployed or shipped. Most domains are at Stage 3; every applied domain has some public evidence of deployment, at Stage 2 for MIP solver components and at Stage 3 elsewhere.</desc>
