<title id="f1t-zh">AI 参与算法设计的五个阶段</title><desc id="f1d-zh">五个设计层次在五个阶段中由 AI 设计或由人提供。AI 负责的层次逐阶段上移：人依次提供算法、算法框架、评估与知识、目标，到第五阶段几乎无需提供。我们目前处于第三阶段。</desc>
